name: Build Voz Amiga APK

on:
  push:
    branches: [ "main", "master" ]
    paths:
      - 'voz-amiga/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout do Código
        uses: actions/checkout@v4

      - name: 🟢 Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'voz-amiga/package.json'

      - name: 📦 Instalar Dependências e Sincronizar Capacitor
        run: |
          cd voz-amiga
          npm install
          npx cap add android || true
          npx cap sync android

      - name: ☕ Configurar Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🔨 Compilar APK Debug
        run: |
          cd voz-amiga/android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: 📤 Guardar APK (Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: voz-amiga-debug-apk
          path: voz-amiga/android/app/build/outputs/apk/debug/app-debug.apk
