name: Teste iOS Seven M Ativus (sem publicação)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ios-simulator:
    runs-on: macos-15
    steps:
      - name: Obter código
        uses: actions/checkout@v4
      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verificar Xcode
        run: xcodebuild -version
      - name: Instalar dependências
        run: npm install --legacy-peer-deps
      - name: Compilar aplicação web para Capacitor
        run: npm run build
        env:
          BUILD_TARGET: ios
          VITE_SUPABASE_URL: https://jyxlgtgzehclcyyvhuvj.supabase.co
          VITE_SUPABASE_ANON_KEY: sb_publishable_xungXBLcpvaCQChW4cOdpg_bGE4xtZ7
      - name: Adicionar plataforma iOS
        run: npx cap add ios
      - name: Sincronizar Capacitor
        run: npx cap sync ios
      - name: Aplicar ícone oficial ATIVUS
        run: |
          brew install imagemagick
          ICON_DIR="ios/App/App/Assets.xcassets/AppIcon.appiconset"
          mkdir -p "$ICON_DIR"
          convert public/ativus-icon.svg -background none -resize 1024x1024 "$ICON_DIR/AppIcon.png"
          cat > "$ICON_DIR/Contents.json" <<'EOF'
          {
            "images": [
              {
                "filename": "AppIcon.png",
                "idiom": "universal",
                "platform": "ios",
                "size": "1024x1024"
              }
            ],
            "info": {
              "author": "xcode",
              "version": 1
            }
          }
          EOF
      - name: Compilar para simulador iOS
        run: |
          xcodebuild -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath ios/build \
            CODE_SIGNING_ALLOWED=NO build
      - name: Guardar aplicação de simulador
        uses: actions/upload-artifact@v4
        with:
          name: ativus-ios-simulator
          path: ios/build/Build/Products/Debug-iphonesimulator/App.app
          if-no-files-found: error
