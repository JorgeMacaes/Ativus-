name: Teste Android Seven M Ativus (sem publicação)
on:
  push:
    branches:
      - 'testes/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - name: Obter código
        uses: actions/checkout@v4
      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Preparar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Preparar Android SDK
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Instalar dependências
        run: npm install --legacy-peer-deps
      - name: Compilar aplicação web para Capacitor Android
        run: npm run build
        env:
          BUILD_TARGET: android
          VITE_SUPABASE_URL: https://jyxlgtgzehclcyyvhuvj.supabase.co
          VITE_SUPABASE_ANON_KEY: sb_publishable_xungXBLcpvaCQChW4cOdpg_bGE4xtZ7
      - name: Adicionar plataforma Android
        run: npx cap add android
      - name: Sincronizar Capacitor
        run: npx cap sync android
      - name: Instalar ferramenta de imagem
        run: sudo apt-get update && sudo apt-get install -y imagemagick
      - name: Aplicar ícone oficial ATIVUS (incluindo ícone adaptativo)
        run: |
          for spec in "mdpi:48:108" "hdpi:72:162" "xhdpi:96:216" "xxhdpi:144:324" "xxxhdpi:192:432"; do
            density=${spec%%:*}
            rest=${spec#*:}
            size=${rest%%:*}
            fgsize=${rest##*:}
            dir="android/app/src/main/res/mipmap-${density}"
            mkdir -p "$dir"
            convert public/ativus-icon.svg -background none -resize "${size}x${size}" "$dir/ic_launcher.png"
            cp "$dir/ic_launcher.png" "$dir/ic_launcher_round.png"
            convert public/ativus-icon.svg -background none -resize "${fgsize}x${fgsize}" "$dir/ic_launcher_foreground.png"
          done
          mkdir -p android/app/src/main/res/mipmap-anydpi-v26
          cat > android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
            <background android:drawable="@color/ativus_icon_background"/>
            <foreground android:drawable="@mipmap/ic_launcher_foreground"/>
          </adaptive-icon>
          EOF
          cp android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml android/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml
          mkdir -p android/app/src/main/res/values
          cat > android/app/src/main/res/values/ativus_icon_colors.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
            <color name="ativus_icon_background">#FFFFFF</color>
          </resources>
          EOF
      - name: Gerar APK de depuração
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug --no-daemon
      - name: Guardar APK como artefacto de teste
        uses: actions/upload-artifact@v4
        with:
          name: ativus-android-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
