name: Teste Android Seven M Ativus (sem publicação)
on:
  push:
    branches:
      - 'testes/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - name: Obter código
        uses: actions/checkout@v4
      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Preparar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Preparar Android SDK
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Instalar dependências
        run: npm install --legacy-peer-deps
      - name: Compilar aplicação web para Capacitor Android
        run: npm run build
        env:
          BUILD_TARGET: android
      - name: Adicionar plataforma Android
        run: npx cap add android
      - name: Sincronizar Capacitor
        run: npx cap sync android
      - name: Instalar ferramenta de imagem
        run: sudo apt-get update && sudo apt-get install -y imagemagick
      - name: Aplicar ícone Seven M Ativus
        run: |
          for spec in "mdpi:48" "hdpi:72" "xhdpi:96" "xxhdpi:144" "xxxhdpi:192"; do
            density=${spec%%:*}
            size=${spec##*:}
            mkdir -p "android/app/src/main/res/mipmap-${density}"
            convert public/ativus-icon.svg -background none -resize "${size}x${size}" "android/app/src/main/res/mipmap-${density}/ic_launcher.png"
            cp "android/app/src/main/res/mipmap-${density}/ic_launcher.png" "android/app/src/main/res/mipmap-${density}/ic_launcher_round.png"
          done
      - name: Gerar APK de depuração
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug --no-daemon
      - name: Guardar APK como artefacto de teste
        uses: actions/upload-artifact@v4
        with:
          name: seven-m-ativus-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
